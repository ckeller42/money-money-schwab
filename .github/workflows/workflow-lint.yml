# Lints the workflow files themselves. Deliberately a separate, NON-required
# check: it must never gate merging (and the `CI` / `lint-and-test` check
# names stay untouched).
name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install actionlint and zizmor (pinned)
        run: pip install actionlint-py==1.7.12.25 zizmor==1.30.1

      - name: actionlint
        run: actionlint

      # --offline: no GitHub API calls (the token is not exposed to this step),
      # so the network-dependent audits (e.g. ref-version-mismatch,
      # impostor-commit) are skipped; every offline audit still runs.
      - name: zizmor
        run: zizmor --offline --no-progress --min-severity low .
