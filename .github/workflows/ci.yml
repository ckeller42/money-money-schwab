name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per ref (superseded runs are cancelled); every push gets its own group,
  # because a shared group would still cancel an older *pending* run on main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Never cancel a run on main; only superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks shellcheck
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck extension/SchwabPortfolio.lua

      - name: Run shellcheck
        run: |
          shellcheck install.sh sync.sh tests/test_xlsx2csv.sh \
            tests/test_check_personal_data.sh tools/check_personal_data.sh

      - name: Run tests
        run: lua5.3 extension/SchwabPortfolio.lua

      - name: Run xlsx2csv converter test
        run: |
          perl -c xlsx2csv
          bash tests/test_xlsx2csv.sh

      - name: Run personal-data scanner test
        run: bash tests/test_check_personal_data.sh

      # Scans EVERY tracked text file (binaries are skipped), no file-type or
      # scanner-file exclusions. The logic lives in one script shared with the
      # pre-commit hook; on a hit it prints file:line and the rule, never the
      # matched value (this log is public).
      - name: Check for secrets and personal data
        run: git ls-files | tools/check_personal_data.sh
